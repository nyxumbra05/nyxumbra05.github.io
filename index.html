<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>NyxUmbra</title>

  <style>
    body {
      background: #0f172a;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      font-size: 48px;
      color: #38bdf8;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    button {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
    }

    button:hover {
      background: #0ea5e9;
    }
  </style>
</head>

<body><body>
  <h1>NyxUmbra</h1>
  <p id="yazi">GitHub Pages üzerinde çalışan test sitesi</p>
  <button onclick="degistir()">Tıkla</button>

  <script>
    function degistir() {
      document.getElementById("yazi").innerText =
        "Buton çalışıyor 🚀";
    }
  </script>
</body>

  
  <h1>NyxUmbra</h1>
  <p>GitHub Pages üzerinde çalışan test sitesi</p>
  <button>Tıkla</button>
</body>
</html>
